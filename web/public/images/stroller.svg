<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Frido Autofold Travel Stroller">
  <title>Frido Autofold Travel Stroller</title>
  <defs>
    <linearGradient id="strollerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eefbf7" />
      <stop offset="100%" stop-color="#d3f5ec" />
    </linearGradient>
  </defs>

  <rect width="240" height="200" rx="20" fill="url(#strollerBg)" />
  <ellipse cx="118" cy="176" rx="76" ry="9" fill="#7fdcc6" opacity="0.5" />

  <g fill="none" stroke="#0a6957" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- folding hood -->
    <path d="M64 92c0-26 15-44 38-44 9 0 17 3 23 8l-14 36z" fill="#12a186" />
    <path d="M74 70c8-9 18-13 29-12" stroke="#ffffff" stroke-width="4" opacity="0.6" />

    <!-- seat -->
    <path d="M64 92h58" />
    <path d="M122 92l16 34H86" fill="#d3f5ec" />

    <!-- handlebar -->
    <path d="M64 92 46 58" />
    <path d="M38 52h18" />

    <!-- footrest -->
    <path d="M138 126l22 6" />

    <!-- under-basket -->
    <path d="M92 140h44a6 6 0 0 0 0-12H92a6 6 0 0 0 0 12z" fill="#d3f5ec" stroke-width="5" />

    <!-- frame -->
    <path d="M86 126 74 158" />
    <path d="M138 126l18 26" />

    <!-- wheels -->
    <circle cx="70" cy="160" r="17" fill="#ffffff" />
    <circle cx="160" cy="158" r="12" fill="#ffffff" />
  </g>

  <circle cx="70" cy="160" r="5" fill="#0a6957" />
  <circle cx="160" cy="158" r="4" fill="#0a6957" />
</svg>
